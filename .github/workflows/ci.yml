name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # jurplel/install-qt-action v4
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        if: runner.os != 'macOS'
        with:
          version: '6.8.*'
          cache: true
      # Qt 6.8 still links the AGL framework, which current Xcode no longer ships.
      - name: Install Qt with Homebrew
        if: runner.os == 'macOS'
        run: brew install qtbase qtdeclarative qtsvg
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Start the application
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          set -euo pipefail
          app=$(find build -type f \( -name AnyDevKitStudio -o -name AnyDevKitStudio.exe \) | head -n 1)
          test -n "$app"
          "$app" --screenshot window.png
          test -s window.png
